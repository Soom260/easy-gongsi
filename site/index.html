<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>쉬운 기업 들여다보기</title>
  <meta name="description" content="상장회사의 공시와 재무제표를 주식 초보가 알아들을 수 있는 말로 바꿔 보여 줍니다.">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <a class="skip-link" href="#view">본문으로 건너뛰기</a>

  <header class="site-header">
    <div class="wrap">
      <p class="site-title"><a href="./">쉬운 기업 들여다보기</a></p>
      <p class="tagline">어려운 공시를 쉬운 말로 읽어 드려요.</p>
    </div>
  </header>

  <main class="wrap">
    <form id="search-form" class="search" role="search" action="./" method="get" novalidate>
      <label for="q">회사 이름 또는 종목코드</label>
      <div class="search-row">
        <input id="q" name="q" type="search" autocomplete="off" aria-describedby="q-hint q-error">
        <button type="submit">찾기</button>
      </div>
      <p id="q-hint" class="hint">예: 삼성전자, 005930</p>
      <p id="q-error" class="field-error" hidden></p>
    </form>

    <!-- 불러오는 중 같은 상태 안내를 화면 읽기 프로그램이 읽어 줌 -->
    <p id="status" class="status" role="status" aria-live="polite"></p>

    <div id="view" tabindex="-1"></div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <ul class="footer-list">
        <li>데이터 출처: <a href="https://opendart.fss.or.kr/" target="_blank" rel="noopener">금융감독원 OpenDART<span class="sr-only"> (새 창)</span></a>
          · <a id="terms-link" href="https://opendart.fss.or.kr/intro/terms.do" target="_blank" rel="noopener">이용약관<span class="sr-only"> (새 창)</span></a></li>
        <li>쉬운말 설명: 직접 작성 (구글 시트로 관리)</li>
        <li>데이터 기준 시각: <span id="data-as-of">불러오는 중…</span></li>
        <li>페이지 생성 시각: <span id="generated-at">불러오는 중…</span></li>
      </ul>
      <p class="disclaimer">이 사이트는 투자 권유가 아니며 정보 제공 목적입니다. 특정 회사를 사거나 팔라는 뜻이 아니에요. 투자 판단과 책임은 본인에게 있어요.</p>
    </div>
  </footer>

  <script src="assets/app.js"></script>
</body>
</html>
